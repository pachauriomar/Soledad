<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Me perdonas, Ayde Soledad?</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="64" height="64">
        <circle cx="32" cy="32" r="30" fill="#fff" stroke="#14b8a6" stroke-width="3" />
        <path d="M26 14h12v12h12v12H38v12H26V38H14V26h12z" fill="#ef4468" />
      </svg>
    </div>

    <p class="subtitle">Para la mejor enfermera del mundo 💉🩺</p>
    <h1>¿Me perdonas,<br /><span>Ayde Soledad</span>?</h1>

    <svg class="ecg" viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true">
      <polyline points="0,30 90,30 110,30 125,8 142,52 158,30 230,30 250,30 265,14 280,44 295,30 400,30" />
    </svg>

    <p class="note">Prometo cuidar de ti tanto como tú cuidas de los demás ❤️</p>

    <div class="buttons" id="buttons">
      <button id="yesBtn" class="btn yes" type="button">SÍ 💖</button>
      <button id="noBtn" class="btn no" type="button">NO</button>
    </div>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-box">
      <div class="modal-icon">🥰</div>
      <h2 id="modalTitle">¡Lo sabía que me perdonarías!</h2>
      <p>Gracias, Ayde Soledad. Eres mi enfermera favorita 💉</p>
      <button id="closeBtn" class="btn yes" type="button">Cerrar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
